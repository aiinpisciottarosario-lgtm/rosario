// ============================================================================
// FUNZIONI - CALCOLI BMR/TDEE/MACROS
// ============================================================================
function calcBMR(p) {
  const base = 10 * p.weight + 6.25 * p.height - 5 * p.age;
  return p.sex === "M" ? base + 5 : base - 161;
}

function calcPlan(p, goal) {
  const bmr = calcBMR(p);
  const tdee = bmr * ACTIVITY[p.activity];
  const lbm = p.weight * (p.sex === "M" ? 0.82 : 0.72);

  let pct = 0;
  if (goal === "definizione") pct = -0.20;
  if (goal === "massa") pct = 0.12;

  let targetKcal = tdee * (1 + pct);
  const floor = p.sex === "M" ? 1500 : 1200;
  const flooredWarning = targetKcal < floor;
  if (flooredWarning) targetKcal = floor;

  const proteinG = lbm * 1.9;
  const carbsG = goal === "definizione" ? 20 : goal === "massa" ? 40 : 30;
  const fatKcal = Math.max(targetKcal - proteinG * 4 - carbsG * 4, 300);

  return {
    bmr: Math.round(bmr),
    tdee: Math.round(tdee),
    lbm: Math.round(lbm * 10) / 10,
    targetKcal: Math.round(targetKcal),
    flooredWarning,
    protein: Math.round(proteinG),
    carbs: carbsG,
    fat: Math.round(fatKcal / 9),
    proteinKcal: Math.round(proteinG * 4),
    carbsKcal: carbsG * 4,
    fatKcal: Math.round(fatKcal),
  };
}

// ============================================================================
// FUNZIONI - RILEVAMENTO CARENZE
// ============================================================================
function laggingParts(profile, measurements = {}) {
  // Confronta misure utente ai target di riferimento
  // Ritorna top 2 gruppi muscolari sotto target

  if (!measurements || Object.keys(measurements).length === 0) {
    return []; // Nessuna misura disponibile
  }

  const targets = CLASSIC_TARGETS[profile.sex];
  const deltas = {};

  Object.keys(targets).forEach(part => {
    const target = targets[part];
    const measured = measurements[part] || 0;
    const percentageOfTarget = measured / target;
    deltas[part] = {
      target,
      measured,
      percentageOfTarget,
      delta: measured - target,
    };
  });

  // Ordina per percentuale (dal più basso)
  const sorted = Object.entries(deltas)
    .sort((a, b) => a[1].percentageOfTarget - b[1].percentageOfTarget)
    .filter(([_, d]) => d.percentageOfTarget < 0.95); // Solo quelli sotto il 95% del target

  // Ritorna top 2
  return sorted.slice(0, 2).map(([part, _]) => part);
}

// FUNZIONI - MOTORE DIETA (buildMealPlan con correzioni)
// ============================================================================
function buildMealPlan(profile, plan, pantryItems = [], dayIndex = 0, supplements = []) {
  // Meccanismo: calcolo sequenziale per pasto, poi 2 correzioni di precisione finali
  // Fase 1: aggiusta proteine (ultima fonte)
  // Fase 2: aggiusta calorie (grasso puro)

  const meals = ['Colazione', 'Spuntino 1', 'Pranzo', 'Spuntino 2', 'Cena'];
  const mealPlan = {
    meals: [],
    daily: { p: 0, f: 0, c: 0, kcal: 0 },
    grand: { p: 0, f: 0, c: 0, kcal: 0 }
  };

  // Suddivisione macro per pasto (semplificata)
  const mealMacros = [
    { pPct: 0.15, fPct: 0.2, cPct: 0.2 },   // Colazione
    { pPct: 0.1, fPct: 0.2, cPct: 0.2 },    // Spuntino 1
    { pPct: 0.3, fPct: 0.25, cPct: 0.3 },   // Pranzo
    { pPct: 0.1, fPct: 0.15, cPct: 0.15 },  // Spuntino 2
    { pPct: 0.35, fPct: 0.2, cPct: 0.15 }   // Cena
  ];

  // Calcolo per pasto (sequenziale semplice)
  meals.forEach((mealName, mealIdx) => {
    const ratio = mealMacros[mealIdx];
    const targetP = plan.protein * ratio.pPct;
    const targetF = plan.fat * ratio.fPct;
    const targetC = plan.carbs * ratio.cPct;

    let foods = [];

    // Selezione alimenti (logica semplificata)
    if (mealName === 'Pranzo' || mealName === 'Cena') {
      // Sempre proteina da carne/pesce
      const proteinSources = FOOD_DB.filter(f => f.role === 'protein' && (f.sub === 'carne' || f.sub === 'pesce'));
      if (proteinSources.length > 0) {
        const protein = proteinSources[dayIndex % proteinSources.length];
        const portion = Math.min(targetP / protein.p * 100, 280);
        foods.push({ ...protein, portion, p: protein.p * portion / 100, f: protein.f * portion / 100, c: protein.c * portion / 100 });
      }
    } else {
      // Altri pasti: uova, formaggio, latticini
      const proteinSources = FOOD_DB.filter(f => f.role === 'protein' && (f.sub === 'uova' || f.sub === 'formaggio' || f.sub === 'latticini'));
      if (proteinSources.length > 0) {
        const protein = proteinSources[dayIndex % proteinSources.length];
        const portion = Math.min(targetP / protein.p * 100, 150);
        foods.push({ ...protein, portion, p: protein.p * portion / 100, f: protein.f * portion / 100, c: protein.c * portion / 100 });
      }
    }

    // Grassi
    const fatSources = FOOD_DB.filter(f => f.role === 'fat' && f.sub === 'grasso');
    if (fatSources.length > 0) {
      const fat = fatSources[dayIndex % fatSources.length];
      const portion = Math.min(targetF / fat.f * 100, 150);
      foods.push({ ...fat, portion, p: fat.p * portion / 100, f: fat.f * portion / 100, c: fat.c * portion / 100 });
    }

    // Verdure
    const vegSources = FOOD_DB.filter(f => f.role === 'veg' && f.c <= 4);
    if (vegSources.length > 0) {
      const veg = vegSources[(dayIndex + mealIdx) % vegSources.length];
      foods.push({ ...veg, portion: 200, p: veg.p * 2, f: veg.f * 2, c: veg.c * 2 });
    }

    // Calcoli totali per pasto
    const mealTotals = foods.reduce((acc, f) => ({
      p: acc.p + f.p,
      f: acc.f + f.f,
      c: acc.c + f.c,
    }), { p: 0, f: 0, c: 0 });

    mealTotals.kcal = Math.round(mealTotals.p * 4 + mealTotals.f * 9 + mealTotals.c * 4);

    mealPlan.meals.push({
      name: mealName,
      foods: foods.map(f => ({
        name: f.name,
        portion: Math.round(f.portion * 10) / 10,
        p: Math.round(f.p * 10) / 10,
        f: Math.round(f.f * 10) / 10,
        c: Math.round(f.c * 10) / 10,
      })),
      totals: mealTotals
    });

    mealPlan.daily.p += mealTotals.p;
    mealPlan.daily.f += mealTotals.f;
    mealPlan.daily.c += mealTotals.c;
  });

  mealPlan.daily.kcal = Math.round(mealPlan.daily.p * 4 + mealPlan.daily.f * 9 + mealPlan.daily.c * 4);

  // CORREZIONI POST-HOC
  // Fase 1: Proteina
  if (mealPlan.meals.length > 0) {
    const lastMeal = mealPlan.meals[mealPlan.meals.length - 1];
    if (lastMeal.foods.length > 0) {
      const proteinDelta = plan.protein - mealPlan.daily.p;
      const lastFood = lastMeal.foods[lastMeal.foods.length - 1];
      lastFood.p = Math.round((lastFood.p + proteinDelta) * 10) / 10;
      mealPlan.daily.p += proteinDelta;
    }
  }

  // Fase 2: Calorie (solo grasso puro)
  if (mealPlan.meals.length > 0) {
    const lastMeal = mealPlan.meals[mealPlan.meals.length - 1];
    const pureFat = lastMeal.foods.find(f => !f.sub || f.sub === 'grasso');
    if (pureFat) {
      const caloriesDelta = plan.targetKcal - mealPlan.daily.kcal;
      const fatGramsDelta = caloriesDelta / 9;
      pureFat.f = Math.round((pureFat.f + fatGramsDelta) * 10) / 10;
      mealPlan.daily.f += fatGramsDelta;
    }
  }

  mealPlan.daily.kcal = Math.round(mealPlan.daily.p * 4 + mealPlan.daily.f * 9 + mealPlan.daily.c * 4);
  mealPlan.grand = { ...mealPlan.daily };

  return mealPlan;
}

function buildTrainingDay(dayNum, goal, laggingParts = []) {
  let dayExercises = EXERCISE_DB.filter(e => e.day === dayNum);

  // Adatta gli esercizi in base al goal (definizione: sostituzione a macchine dopo 2 esercizi)
  if (goal === "definizione") {
    dayExercises = dayExercises.map((ex, idx) => {
      if (idx > 1 && ex.equipment === "bilanciere") {
        return { ...ex, equipment: "macchina", reps: "10-12", rest: "60-90s" };
      }
      return ex;
    });
  }

  // Aggiungi esercizi extra per carenze in CIMA al giorno
  const extraExercises = [];
  laggingParts.forEach(lagPart => {
    const possibleExtras = EXTRA_EXERCISE[lagPart] || [];
    possibleExtras.forEach(extraEx => {
      // Aggiungi SOLO se questo giorno allena quel gruppo muscolare
      if (dayExercises.some(e => e.group === lagPart || e.group === extraEx.group)) {
        extraExercises.push({ ...extraEx, isExtra: true, day: dayNum });
      }
    });
  });

  // Inserisci extra in cima, poi gli esercizi normali
  return [...extraExercises, ...dayExercises];
}

    <div className="container">
      <div className="title">

          </div>
          <div className="stat">
            <span>TDEE:</span>
            <span className="success">{plan.tdee} kcal</span>

            <span>Target Giornaliero:</span>
            <span className="success">{plan.targetKcal} kcal</span>

        </div>

        <div style={{ marginTop: 20 }}>
          <div className="label">Macronutrienti Chetogenici</div>
          <div className="info">
            <div className="stat">
              <span>Proteine:</span>
              <span className="success">{plan.protein}g</span>
            </div>
            <div className="stat">
              <span>Grassi:</span>
              <span className="success">{plan.fat}g</span>
            </div>
            <div className="stat">

      <div className="tabs">
        <button className={`tab-btn ${activeTab === 'nutrition' ? 'active' : ''}`} onClick={() => setActiveTab('nutrition')}>
          🍽️ Nutrizione

        <button className={`tab-btn ${activeTab === 'workout' ? 'active' : ''}`} onClick={() => setActiveTab('workout')}>

        ← Torna Indietro

    </div>
  );
}

function LaggingPartsManager({ profile, onUpdate }) {
  const [measurements, setMeasurements] = React.useState(profile.measurements || {});
  const [selectedCarences, setSelectedCarences] = React.useState(profile.selectedCarences || []);
  const [showMeasurements, setShowMeasurements] = React.useState(false);

  const auto_lagging = laggingParts(profile, measurements);
  const current_lagging = selectedCarences.length > 0 ? selectedCarences : auto_lagging;

  const handleMeasurementChange = (part, value) => {
    const newMeasurements = { ...measurements, [part]: parseFloat(value) || 0 };
    setMeasurements(newMeasurements);
    onUpdate({ measurements: newMeasurements, selectedCarences });
  };

  const toggleCarence = (part) => {
    let newCarences = [...selectedCarences];
    if (newCarences.includes(part)) {
      newCarences = newCarences.filter(c => c !== part);
    } else {
      if (newCarences.length < 2) {
        newCarences.push(part);
      } else {
        newCarences[newCarences.length - 1] = part;
      }
    }
    setSelectedCarences(newCarences);
    onUpdate({ measurements, selectedCarences: newCarences });
  };

  const targets = CLASSIC_TARGETS[profile.sex];

  return (
    <div className="panel">
      <div className="subtitle">⚡ CARENZE - Specializzazione</div>

      <button
        onClick={() => setShowMeasurements(!showMeasurements)}
        style={{marginBottom: 15, width: '100%', background: '#D9A860'}}
      >
        {showMeasurements ? '▼ Nascondi Misure' : '▲ Aggiungi Misure'}
      </button>

      {showMeasurements && (
        <div style={{background: '#16241F', padding: 15, borderRadius: 4, marginBottom: 15}}>
          <div className="label">Inserisci le tue misure (cm)</div>
          <div className="grid-3">
            {Object.keys(targets).map(part => (
              <div key={part}>
                <label style={{fontSize: '0.85em', display: 'block', marginBottom: 5}}>
                  {part.charAt(0).toUpperCase() + part.slice(1).replace(/o$/, 'a')}
                  <br/>
                  <span style={{color: '#999', fontSize: '0.8em'}}>target: {targets[part]}</span>
                </label>
                <input
                  type="number"
                  value={measurements[part] || ''}
                  onChange={(e) => handleMeasurementChange(part, e.target.value)}
                  placeholder="0"
                  style={{width: '100%', marginBottom: 0}}
                />
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="label">Scegli fino a 2 zone carenti</div>
      {auto_lagging.length > 0 && !selectedCarences.length > 0 && (
        <div style={{fontSize: '0.9em', color: '#D9A860', marginBottom: 10}}>
          💡 Rilevate automaticamente: {auto_lagging.join(', ')}
        </div>
      )}

      <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
        {Object.keys(targets).map(part => (
          <button
            key={part}
            onClick={() => toggleCarence(part)}
            style={{
              padding: 10,
              background: selectedCarences.includes(part) ? '#2FBF71' : '#16241F',
              color: selectedCarences.includes(part) ? '#17140F' : '#E9F2ED',
              border: '1px solid ' + (auto_lagging.includes(part) ? '#D9A860' : '#213730'),
              borderRadius: 4,
              cursor: 'pointer',
              fontWeight: selectedCarences.includes(part) ? 'bold' : 'normal',
            }}
          >
            {part.charAt(0).toUpperCase() + part.slice(1).replace(/o$/, 'a')}
            {auto_lagging.includes(part) && selectedCarences.includes(part) === false && ' ⚠️'}
          </button>
        ))}
      </div>

      {current_lagging.length > 0 && (
        <div style={{marginTop: 15, padding: 12, background: '#16241F', borderRadius: 4, fontSize: '0.9em'}}>
          <strong>✓ Esercizi mirati:</strong> {current_lagging.length} zona/e = {current_lagging.length * 2} esercizi extra in cima ai giorni relativi
        </div>
      )}
    </div>
  );
}

function NutritionPanel({ plan, profile }) {
  const [dayIndex, setDayIndex] = React.useState(0);
  const mealPlan = useMemo(() => buildMealPlan(profile, plan, [], dayIndex, []), [dayIndex, profile, plan]);

  return (
    <div className="panel">
      <div className="subtitle">Piano Alimentare Chetogenico</div>
      <div className="info">
        <div className="stat">
          <span>📊 Target Giornaliero:</span>
          <span>{plan.targetKcal} kcal | {plan.protein}g P | {plan.fat}g F | {plan.carbs}g C</span>
        </div>
        <div className="stat">
          <span>📊 Rapporto Macros:</span>
          <span>{((plan.proteinKcal / plan.targetKcal * 100).toFixed(0))}P / {((plan.carbsKcal / plan.targetKcal * 100).toFixed(0))}C / {((plan.fatKcal / plan.targetKcal * 100).toFixed(0))}F</span>
        </div>
      </div>

      <div style={{marginTop: 15, marginBottom: 15}}>
        <label className="label">Giorno di rotazione: {dayIndex + 1}</label>
        <input
          type="range"
          min="0"
          max="6"
          value={dayIndex}
          onChange={(e) => setDayIndex(parseInt(e.target.value))}
          style={{width: '100%'}}
        />
      </div>

      <div className="subtitle" style={{marginTop: 20}}>Pasti della giornata</div>
      {mealPlan.meals.map((meal, idx) => (
        <div key={idx}>
          <div style={{marginTop: 15, fontWeight: 'bold', color: '#52E092'}}>{meal.name}</div>
          {meal.foods.map((food, fidx) => (
            <div key={fidx} className="meal-item">
              <div className="meal-name">{food.name}</div>
              <div className="meal-portion">{food.portion}g</div>
              <div className="macro-bar">
                <div className="macro-segment macro-protein" style={{width: `${(food.p / (meal.totals.p || 1)) * 100 || 5}%`}}>P{Math.round(food.p)}</div>
                <div className="macro-segment macro-carbs" style={{width: `${(food.c / (meal.totals.c || 1)) * 100 || 5}%`}}>C{Math.round(food.c)}</div>
                <div className="macro-segment macro-fat" style={{width: `${(food.f / (meal.totals.f || 1)) * 100 || 5}%`}}>F{Math.round(food.f)}</div>
              </div>
            </div>
          ))}
          <div style={{padding: '10px', background: '#16241F', borderRadius: '4px', marginTop: '8px', fontSize: '0.9em'}}>
            <strong>{meal.name} Totale:</strong> {meal.totals.kcal} kcal | P{Math.round(meal.totals.p)}g F{Math.round(meal.totals.f)}g C{Math.round(meal.totals.c)}g
          </div>
        </div>
      ))}

      <div style={{padding: '15px', background: '#213730', borderRadius: '4px', marginTop: '20px', fontWeight: 'bold'}}>
        <div className="stat">
          <span>🎯 TOTALE GIORNALIERO</span>
          <span className="success">{mealPlan.grand.kcal} kcal</span>
        </div>
        <div className="stat">
          <span>Proteine:</span>
          <span className="success">{Math.round(mealPlan.grand.p)}g (target {plan.protein}g)</span>
        </div>
        <div className="stat">
          <span>Grassi:</span>
          <span className="success">{Math.round(mealPlan.grand.f)}g (target {plan.fat}g)</span>
        </div>
        <div className="stat">
          <span>Carboidrati:</span>
          <span className="warning">{Math.round(mealPlan.grand.c)}g (target {plan.carbs}g)</span>
        </div>
      </div>
    </div>
  );
}

function WorkoutPanel({ profile }) {
  const lagging = profile.selectedCarences && profile.selectedCarences.length > 0
    ? profile.selectedCarences
    : laggingParts(profile, profile.measurements || {});

  return (
    <div className="panel">
      <div className="subtitle">Split 4 giorni Upper/Lower x2</div>
      <p style={{fontSize: '0.9em', color: '#999', marginBottom: 15}}>Goal: <strong>{profile.goal === 'definizione' ? 'Scolpitura' : profile.goal === 'massa' ? 'Bulk' : 'Mantenimento'}</strong></p>

      {lagging.length > 0 && (
        <div style={{background: '#16241F', padding: 12, borderRadius: 4, marginBottom: 15, fontSize: '0.9em'}}>
          <strong>✓ Specializzazione attiva:</strong> {lagging.join(', ')}
          <br/>
          <span style={{color: '#999'}}>Esercizi extra mirati in cima ai giorni correlati</span>
        </div>
      )}

      {DAYS_SPLIT.map(day => {
        const dayExercises = buildTrainingDay(day.dayNum, profile.goal, lagging);
        return (
          <div key={day.dayNum}>
            <div style={{marginTop: 15}}>
              <div className="label">{day.name} — {day.focus}</div>
              {dayExercises.map((ex, idx) => (
                <div key={idx} className="exercise-card" style={{borderLeftColor: ex.isExtra ? '#D9A860' : '#2FBF71'}}>
                  <div className="exercise-name">
                    {ex.isExtra && '⚡ '}
                    {ex.name} <span style={{color: '#999', fontSize: '0.8em'}}>({ex.eng})</span>
                  </div>
                  <div className="exercise-meta">
                    {ex.sets} x {ex.reps} • {ex.equipment} • {ex.rest} rest • RPE {ex.rpe}
                    {ex.isExtra && <span style={{color: '#D9A860', marginLeft: 10}}>MIRATI CARENZE</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [profile, setProfile] = useState(() => {
    try {
      const saved = localStorage.getItem("ik_profile");
      return saved ? JSON.parse(saved) : null;
    } catch {
      return null;
    }
  });

  const handleProfileUpdate = (updatedProfile) => {
    setProfile(updatedProfile);
    localStorage.setItem("ik_profile", JSON.stringify(updatedProfile));
  };

  if (!profile) {
    return <IntakeForm onComplete={(p) => {
      localStorage.setItem("ik_profile", JSON.stringify(p));
      setProfile(p);
    }} />;
  }

  return <Dashboard profile={profile} onProfileUpdate={handleProfileUpdate} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
